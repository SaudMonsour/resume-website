<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title id="main-title">Loading...</title>
    <meta name="color-scheme" content="light">
    <meta name="darkreader-lock" content="true">
    <script src="my-data/config.js"></script>
    <script>
        document.write(`<meta name="description" content="${MY_CONFIG.name} - ${MY_CONFIG.title}">`);
        document.write(`<title>${MY_CONFIG.pageTitle}</title>`);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            color-scheme: light !important;
            --bg: #fff;
            --fg: #000;
            --muted: #777;
            --border: #ececec;
            --card-bg: #fafafa;
            --radius: 12px;
            --font-body: 'Inter', sans-serif;
            --font-display: 'Playfair Display', serif;
        }

        html {
            -webkit-text-size-adjust: 100%;
            scroll-behavior: auto;
            background: var(--bg);
        }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--fg);
            min-height: 100svh;
            overflow-x: hidden;
            overscroll-behavior-x: none;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        img { max-width: 100%; }
        button, a { -webkit-tap-highlight-color: transparent; }

        .m-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transform: translateZ(0);
        }

        .m-nav-name {
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: .02em;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .m-nav-links {
            display: flex;
            gap: 18px;
            overflow-x: auto;
            overscroll-behavior-x: contain;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .m-nav-links::-webkit-scrollbar { display: none; }
        .m-nav-links a {
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--fg);
            text-decoration: none;
            white-space: nowrap;
            opacity: .55;
        }
        .m-nav-links a:active { opacity: 1; }

        .m-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 36px 24px 32px;
            gap: 28px;
        }

        .m-hero-img-wrap {
            position: relative;
            width: 100%;
            max-width: 340px;
            aspect-ratio: 3/4;
            border-radius: var(--radius);
            overflow: hidden;
            background: #000;
            user-select: none;
            touch-action: pan-y pinch-zoom;
        }
        .m-hero-img-wrap img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .m-img-base { z-index: 1; }
        .m-img-hover { z-index: 2; opacity: 0; transition: opacity .22s ease; }
        .m-img-hover.show { opacity: 1; }

        .m-hero-text { text-align: center; width: 100%; }
        .m-hero-name {
            font-family: var(--font-display);
            font-size: clamp(2rem, 8vw, 3rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -.02em;
            margin-bottom: 10px;
        }
        .m-hero-title {
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 20px;
        }

        .m-socials { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
        .m-socials a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1.5px solid var(--border);
            color: var(--fg);
            text-decoration: none;
        }
        .m-socials a:active { background: var(--fg); color: var(--bg); }
        .m-socials svg { width: 20px; height: 20px; }

        .m-divider { height: 1px; background: var(--border); margin: 0 24px; }
        .m-section { padding: 40px 24px; }
        .m-section-label {
            font-size: .68rem;
            font-weight: 800;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 24px;
        }

        .m-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 16px;
            content-visibility: auto;
            contain-intrinsic-size: 420px;
        }
        .m-card:last-child { margin-bottom: 0; }
        .m-card-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #f0f0f0; }
        .m-card-body { padding: 18px 16px; }
        .m-card-title {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -.01em;
        }
        .card-title-ampersand { font-family: var(--font-body); font-size: .9em; font-weight: 700; }
        .m-card-desc { font-size: .82rem; line-height: 1.6; color: #555; margin-bottom: 12px; }
        .m-skills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
        .m-skill-tag {
            font-size: .65rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 100px;
            background: var(--card-bg);
            color: var(--fg);
            border: 1px solid var(--border);
        }

        .m-card-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1.5px solid var(--fg);
            color: var(--fg);
            background: transparent;
            text-decoration: none;
            font-family: inherit;
            cursor: pointer;
        }
        .m-card-btn:active { background: var(--fg); color: var(--bg); }
        .m-card-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
        .m-card-btn--primary { background: var(--fg); color: var(--bg); }
        .m-card-btn--primary:active { opacity: .72; }

        .m-cert-thumb {
            width: 100%;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 160px;
            position: relative;
            overflow: hidden;
            touch-action: pan-y pinch-zoom;
        }
        .m-cert-thumb img { width: 100%; height: auto; display: block; }
        .m-cert-thumb-overlay {
            position: absolute;
            right: 12px;
            bottom: 12px;
            border: 0;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,.94);
            color: #000;
            box-shadow: 0 4px 14px rgba(0,0,0,.14);
            cursor: pointer;
        }
        .m-cert-thumb-overlay svg { width: 30px; height: 30px; color: rgba(0,0,0,.35); }

        #m-lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 3000;
            background: rgba(0,0,0,.94);
            align-items: center;
            justify-content: center;
            padding: 20px;
            touch-action: pan-y pinch-zoom;
        }
        #m-lightbox.active { display: flex; }
        #m-lightbox img { max-width: 100%; max-height: 90svh; object-fit: contain; border-radius: 8px; }
        #m-lightbox-close {
            position: absolute;
            top: max(16px, env(safe-area-inset-top));
            right: 20px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            line-height: 1;
            padding: 8px;
        }

        #m-resume-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.76);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s ease;
        }
        #m-resume-overlay.active { opacity: 1; pointer-events: auto; }
        .m-resume-modal-box {
            width: 95%;
            height: 92svh;
            background: #fff;
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 16px 48px rgba(0,0,0,.28);
        }
        .m-resume-modal-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            background: #000;
            color: #fff;
        }
        .m-resume-modal-top span { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
        .m-resume-close { background: none; border: none; color: #fff; font-size: 24px; padding: 0 4px; cursor: pointer; line-height: 1; }
        .m-resume-modal-box iframe { flex: 1; width: 100%; border: 0; background: #fff; }

        .m-footer { padding: 32px 24px; border-top: 1px solid var(--border); text-align: center; }
        #m-blog { scroll-margin-top: 80px; }
        .m-blog-label { font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #666; margin-bottom: 12px; }
        .m-blog-title { font-family: var(--font-display); font-size: 2rem; line-height: 1.2; font-weight: 600; letter-spacing: -.02em; margin-bottom: 20px; }
        .m-blog-description { font-size: 1rem; line-height: 1.75; color: #444; }
        .m-blog-open { display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 14px 20px; margin-top: 24px; background: #000; color: #fff; font-size: 1rem; font-weight: 600; text-decoration: none; border-radius: var(--radius); }
        .m-blog-access { font-size: .875rem; line-height: 1.6; color: #666; margin: 14px 0 28px; }
        .m-blog-topics { list-style: none; }
        .m-blog-topic { display: block; color: #000; text-decoration: none; padding: 20px 0; border-top: 1px solid var(--border); }
        .m-blog-topic strong { display: block; font-size: 1.125rem; margin-bottom: 8px; }
        .m-blog-topic span { display: block; font-size: 1rem; line-height: 1.65; color: #555; }
        .m-blog-open:focus-visible, .m-blog-topic:focus-visible { outline: 2px solid #000; outline-offset: 4px; }
        .m-footer-blog { display: inline-flex; align-items: center; min-height: 44px; font-size: .875rem; color: var(--fg); text-underline-offset: 4px; }
        .m-footer-name { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
        .m-footer-copy { font-size: .72rem; color: var(--muted); letter-spacing: .05em; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <nav class="m-nav">
        <span class="m-nav-name" id="m-nav-name">Loading…</span>
        <div class="m-nav-links">
            <a href="#m-experience">Exp</a>
            <a href="#m-projects">Projects</a>
            <a href="#m-certs">Certs</a>
            <a href="#m-blog">Blog</a>
        </div>
    </nav>

    <section class="m-hero">
        <div class="m-hero-img-wrap" id="m-hero-wrap" role="button" tabindex="0" aria-label="Toggle portrait">
            <img class="m-img-base" id="m-img-base" src="" alt="Hero photo" decoding="async" fetchpriority="high">
            <img class="m-img-hover" id="m-img-hover" src="" alt="Alternate hero photo" decoding="async">
        </div>
        <div class="m-hero-text">
            <h1 class="m-hero-name" id="m-hero-name">—</h1>
            <p class="m-hero-title" id="m-hero-title">—</p>
            <div class="m-socials" id="m-socials"></div>
            <button class="m-card-btn" id="m-view-resume" style="width:100%; margin-top:24px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                View Resume
            </button>
        </div>
    </section>

    <div class="m-divider"></div>


    <section class="m-section" id="m-experience"><p class="m-section-label">Experience</p><div id="m-experience-list"></div></section>
    <div class="m-divider"></div>
    <section class="m-section" id="m-projects"><p class="m-section-label">Projects</p><div id="m-projects-list"></div></section>
    <div class="m-divider"></div>
    <section class="m-section" id="m-certs"><p class="m-section-label">Certifications</p><div id="m-certs-list"></div></section>

    <div class="m-divider"></div>
    <section class="m-section" id="m-blog" aria-labelledby="m-blog-heading">
        <p class="m-section-label">Blog</p>
        <p class="m-blog-label" data-blog-label>Notes &amp; ideas</p>
        <h2 class="m-blog-title" id="m-blog-heading">My journal</h2>
        <p class="m-blog-description">Projects, lessons, and ideas from my work.</p>
        <a class="m-blog-open" href="blog/index.html">Read the blog</a>
        <p class="m-blog-access">Read the articles freely. No sign-in required.</p>
        <ul class="m-blog-topics" aria-label="Blog topics"><!-- Topic links are populated from MY_CONFIG.blog.topics. --></ul>
    </section>

    <div id="m-resume-overlay" aria-hidden="true">
        <div class="m-resume-modal-box">
            <div class="m-resume-modal-top">
                <span>Resume</span>
                <button class="m-resume-close" id="m-resume-close-btn" aria-label="Close resume">&times;</button>
            </div>
            <iframe id="m-resume-frame" data-src="resume.html" title="Resume"></iframe>
        </div>
    </div>

    <footer class="m-footer">
        <div class="m-footer-name" id="m-footer-name">—</div>
        <a class="m-footer-blog" href="#m-blog">Blog</a>
        <div class="m-footer-copy" id="m-footer-copy"></div>
    </footer>

    <div id="m-lightbox" aria-hidden="true">
        <span id="m-lightbox-close" role="button" tabindex="0" aria-label="Close certificate preview">&times;</span>
        <img src="" alt="Certificate preview" id="m-lightbox-img">
    </div>

    <script>
        const EMPTY_DB = { bio: {}, experience: [], projects: [], certs: [] };
        const escapeHtml = (value = '') => String(value).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
        const formatCardTitle = (value = '') => escapeHtml(value).replace(
            /\s+&amp;\s+/g,
            '&nbsp;<span class="card-title-ampersand">&amp;</span>&nbsp;'
        );

        const ghIconSvg = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>`;
        const liveIconSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;
        const expandIconSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>`;
        const checkIconSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;

        function safeUrl(value = '') {
            const url = String(value || '').trim();
            return /^(https?:|mailto:)/i.test(url) ? url : '';
        }

        function renderSocials() {
            const el = document.getElementById('m-socials');
            const parts = [];
            const gh = safeUrl(MY_CONFIG.socials?.github);
            const li = safeUrl(MY_CONFIG.socials?.linkedin);
            const em = String(MY_CONFIG.socials?.email || '').trim();
            if (gh) parts.push(`<a href="${gh}" target="_blank" rel="noopener noreferrer" aria-label="GitHub">${ghIconSvg}</a>`);
            if (li) parts.push(`<a href="${li}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg></a>`);
            if (em) parts.push(`<a href="mailto:${escapeHtml(em)}" aria-label="Email"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg></a>`);
            el.innerHTML = parts.join('');
        }

        function renderExperience(items = []) {
            const el = document.getElementById('m-experience-list');
            if (!items.length) {
                el.innerHTML = '<p style="color:#888;font-size:.85rem">Details coming soon.</p>';
                return;
            }
            el.innerHTML = items.map(item => {
                const skills = String(item.skills || '').split(',').map(s => s.trim()).filter(Boolean);
                const link = safeUrl(item.link);
                const image = item.img ? `<div style="padding:20px;background:#fff;margin-bottom:15px;border-radius:8px;display:flex;justify-content:center"><img src="${escapeHtml(item.img)}" alt="" loading="lazy" decoding="async" style="max-height:60px;width:auto"></div>` : '';
                return `<article class="m-card"><div class="m-card-body">${image}<div class="m-card-title">${formatCardTitle(item.title)}</div>${item.date ? `<div style="font-size:.7rem;font-weight:700;color:var(--muted);margin-bottom:10px;text-transform:uppercase">${escapeHtml(item.date)}</div>` : ''}<div class="m-card-desc">${escapeHtml(item.learned || '')}</div>${skills.length ? `<div class="m-skills">${skills.map(s => `<span class="m-skill-tag">${escapeHtml(s)}</span>`).join('')}</div>` : ''}${link ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="m-card-btn" style="width:100%">${liveIconSvg} Visit Company Website</a>` : ''}</div></article>`;
            }).join('');
        }

        function renderProjects(items = []) {
            const el = document.getElementById('m-projects-list');
            if (!items.length) {
                el.innerHTML = '<p style="color:#888;font-size:.85rem">Project details coming soon.</p>';
                return;
            }
            el.innerHTML = items.map(item => {
                const skills = String(item.skills || '').split(',').map(s => s.trim()).filter(Boolean);
                const link = safeUrl(item.link);
                const isGithub = link.includes('github.com');
                const button = link ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="m-card-btn">${isGithub ? ghIconSvg : liveIconSvg} ${isGithub ? 'View on GitHub' : 'View Live Project'}</a>` : '';
                const image = item.img ? `<img class="m-card-img" src="${escapeHtml(item.img)}" alt="${escapeHtml(item.title || 'Project')}" loading="lazy" decoding="async">` : '';
                return `<article class="m-card">${image}<div class="m-card-body"><div class="m-card-title">${formatCardTitle(item.title)}</div><div class="m-card-desc">${escapeHtml(item.learned || '')}</div>${skills.length ? `<div class="m-skills">${skills.map(s => `<span class="m-skill-tag">${escapeHtml(s)}</span>`).join('')}</div>` : ''}${button}</div></article>`;
            }).join('');
        }

        function certImageUrl(item = {}) {
            if (!item.img) return '';
            if (/^https?:/i.test(item.img)) return item.img;
            if (/^data:image\//i.test(item.img)) return item.img;
            if (/^data:application\/pdf/i.test(item.img)) return '';
            if (item.img.startsWith('my-data/') || item.img.startsWith('./')) return item.img;
            return 'my-data/images/certs/' + item.img;
        }

        function renderCerts(items = []) {
            const el = document.getElementById('m-certs-list');
            if (!items.length) {
                el.innerHTML = '<p style="color:#888;font-size:.85rem">Certifications coming soon.</p>';
                return;
            }
            el.innerHTML = items.map((item, idx) => {
                const skills = String(item.skills || '').split(',').map(s => s.trim()).filter(Boolean);
                const link = safeUrl(item.link);
                const src = certImageUrl(item);
                const pdf = /^data:application\/pdf/i.test(item.img || '') ? `<a href="${escapeHtml(item.img)}" target="_blank" class="m-card-btn">Open certificate PDF</a>` : '';
                const thumb = src
                    ? `<img src="${escapeHtml(src)}" onerror="this.onerror=null; this.src='my-data/images/certificate-placeholder.svg'; this.closest('.m-cert-thumb').dataset.src=this.src;" alt="${escapeHtml(item.title || 'Certificate')}" loading="lazy" decoding="async">`
                    : `<div style="padding:54px 18px;color:#888;font-size:.8rem">Certificate image unavailable</div>`;
                return `<article class="m-card"><div class="m-cert-thumb" data-src="${escapeHtml(src)}" id="m-cert-${idx}">${thumb}${src ? `<button type="button" class="m-cert-thumb-overlay" aria-label="Preview ${escapeHtml(item.title || 'certificate')}">${expandIconSvg}</button>` : ''}</div><div class="m-card-body"><div class="m-card-title">${formatCardTitle(item.title)}</div><div class="m-card-desc">${escapeHtml(item.learned || '')}</div>${skills.length ? `<div class="m-skills">${skills.map(s => `<span class="m-skill-tag">${escapeHtml(s)}</span>`).join('')}</div>` : ''}${pdf}${link ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="m-card-btn m-card-btn--primary">${checkIconSvg} Verify Certificate</a>` : ''}</div></article>`;
            }).join('');
        }

        function setupLightbox() {
            const lightbox = document.getElementById('m-lightbox');
            const image = document.getElementById('m-lightbox-img');
            const close = () => {
                lightbox.classList.remove('active');
                lightbox.setAttribute('aria-hidden', 'true');
                image.removeAttribute('src');
            };
            document.getElementById('m-certs-list').addEventListener('click', e => {
                const button = e.target.closest('.m-cert-thumb-overlay');
                if (!button) return;
                const thumb = button.closest('.m-cert-thumb');
                const src = thumb?.dataset.src;
                if (!src) return;
                image.src = src;
                lightbox.classList.add('active');
                lightbox.setAttribute('aria-hidden', 'false');
            });
            document.getElementById('m-lightbox-close').addEventListener('click', close);
            lightbox.addEventListener('click', e => { if (e.target === lightbox) close(); });
            document.addEventListener('keydown', e => { if (e.key === 'Escape' && lightbox.classList.contains('active')) close(); });
        }

        function setupResumeModal() {
            const overlay = document.getElementById('m-resume-overlay');
            const frame = document.getElementById('m-resume-frame');
            const open = () => {
                if (!frame.dataset.loaded) {
                    frame.src = frame.dataset.src;
                    frame.dataset.loaded = 'true';
                }
                overlay.classList.add('active');
                overlay.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
            };
            const close = () => {
                overlay.classList.remove('active');
                overlay.setAttribute('aria-hidden', 'true');
                document.body.style.overflow = '';
            };
            document.getElementById('m-view-resume').addEventListener('click', open);
            document.getElementById('m-resume-close-btn').addEventListener('click', close);
            overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
            document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlay.classList.contains('active')) close(); });
        }

        function setupHeroToggle() {
            const wrap = document.getElementById('m-hero-wrap');
            const hover = document.getElementById('m-img-hover');
            const toggle = () => hover.classList.toggle('show');
            wrap.addEventListener('click', toggle);
            wrap.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggle();
                }
            });
        }

        async function loadData() {
            try {
                const response = await fetch(MY_CONFIG.dataFile, { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const published = await response.json();
                if (new URLSearchParams(location.search).get('preview') === '1') {
                    try { return { ...published, ...JSON.parse(localStorage.getItem(MY_CONFIG.storageKey + ':draft') || '{}') }; }
                    catch (error) { console.warn('Draft unavailable.', error); }
                }
                return published;
            } catch (error) {
                console.warn('Failed to load portfolio data', error);
                return EMPTY_DB;
            }
        }

        async function init() {
            const name = MY_CONFIG.name || '';
            document.getElementById('m-nav-name').textContent = name;
            document.getElementById('m-hero-name').textContent = name;
            document.getElementById('m-hero-title').textContent = MY_CONFIG.title || '';
            document.getElementById('main-title').textContent = MY_CONFIG.pageTitle || name;
            document.getElementById('m-img-base').src = MY_CONFIG.heroBaseImage || '';
            document.getElementById('m-img-hover').src = MY_CONFIG.heroHoverImage || '';

            renderSocials();
            setupHeroToggle();
            setupResumeModal();
            setupLightbox();

            const db = await loadData();
            const bio = db.bio || {};
            const displayName = name || bio.name;

            renderExperience(Array.isArray(db.experience) ? db.experience : []);
            renderProjects(Array.isArray(db.projects) ? db.projects : []);
            renderCerts(Array.isArray(db.certs) ? db.certs : []);

            document.getElementById('m-footer-name').textContent = displayName;
            document.getElementById('m-footer-copy').textContent = `All rights reserved to ${displayName}. © ${new Date().getFullYear()}`;
        }

        init().catch(error => console.error('Mobile init failed', error));
    </script>
    <!-- Shared template settings: optional blog and desktop resume viewer. -->
    <script src="site.js"></script>
</body>
</html>
