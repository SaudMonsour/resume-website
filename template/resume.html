<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume</title>
  <script src="my-data/config.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #000;
      background: #f2f2f2;
      font-size: 14px;
      line-height: 1.45;
    }
    .download-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: flex-end;
      padding: 10px 24px;
      background: #000;
    }
    .download-btn {
      border: 1px solid #555;
      background: #111;
      color: #fff;
      font: inherit;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    .page {
      width: 210mm;
      min-height: 297mm;
      margin: 24px auto;
      padding: 18mm 17mm 15mm;
      background: #fff;
      box-shadow: 0 4px 24px rgba(0,0,0,.12);
    }
    h1 {
      margin: 0 0 2px;
      font-size: 29px;
      line-height: 1.08;
      letter-spacing: .01em;
    }
    .headline {
      margin: 0 0 8px;
      font-size: 15px;
      letter-spacing: .10em;
      text-transform: uppercase;
    }
    .contact {
      font-size: 12.5px;
      line-height: 1.65;
      margin-bottom: 18px;
    }
    a { color: #000; }
    section { margin-top: 17px; }
    .section-title {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
    }
    p { margin: 0; }
    .summary { line-height: 1.48; }
    .skills-row { margin: 2px 0; }
    .skills-row strong { font-weight: 800; }
    .entry-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: baseline;
      margin-bottom: 2px;
    }
    .entry-head strong { font-size: 13.5px; }
    .date { white-space: nowrap; }
    .role { font-style: italic; margin-bottom: 5px; }
    ul {
      margin: 4px 0 0 15px;
      padding: 0;
    }
    li { margin: 3px 0; padding-left: 0; }
    .education-line { margin: 2px 0; }
    .cert { margin: 3px 0; }
    .cert strong { font-weight: 800; }
    .languages { margin-top: 14px; }
    @page { size: A4 portrait; margin: 0; }
    @media print {
      body { background: #fff; }
      .download-bar { display: none !important; }
      .page {
        margin: 0;
        width: 210mm;
        min-height: 297mm;
        box-shadow: none;
      }
    }
    @media (max-width: 820px) {
      body { background: #fff; font-size: 13px; }
      .page {
        width: 100%;
        min-height: 0;
        margin: 0;
        padding: 28px 22px 36px;
        box-shadow: none;
      }
      h1 { font-size: 28px; }
      .headline { font-size: 13px; letter-spacing: .08em; }
      .contact { font-size: 12px; }
      .entry-head { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="download-bar"><button class="download-btn" onclick="window.print()">Download / Print PDF</button></div>
  <main class="page"><header><h1 id="resume-name"></h1><div class="headline" id="resume-title"></div><div class="contact" id="resume-contact"></div></header><div id="resume-content">Loading resume…</div></main>
  <script>
    // Share portfolio entries instead of maintaining a second hardcoded resume.
    // Optional resume-only details are documented in portfolio_data.json.
    const esc = value => String(value || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const safeLink = value => { try { const url = new URL(value); return ['https:','http:'].includes(url.protocol) ? url.href : ''; } catch { return ''; } };
    const link = (text, href) => safeLink(href) ? '<a href="' + esc(safeLink(href)) + '" target="_blank" rel="noopener">' + esc(text) + '</a>' : esc(text);
    const section = (title, html) => html ? '<section><h2 class="section-title">' + esc(title) + '</h2>' + html + '</section>' : '';
    async function loadResume() {
      const response = await fetch(MY_CONFIG.dataFile, {cache:'no-store'});
      if (!response.ok) throw new Error('Could not load resume data.');
      let data = await response.json();
      if (new URLSearchParams(location.search).get('preview') === '1') {
        try { data = {...data, ...JSON.parse(localStorage.getItem(MY_CONFIG.storageKey + ':draft') || '{}')}; } catch {}
      }
      const bio = data.bio || {}, resume = data.resume || {};
      const name = MY_CONFIG.name || bio.name || 'Your Name';
      document.title = name + ' — Resume';
      document.getElementById('resume-name').textContent = name;
      document.getElementById('resume-title').textContent = MY_CONFIG.title || bio.title || '';
      const contact = [bio.loc, resume.phone].filter(Boolean).map(esc);
      if (MY_CONFIG.socials?.email) contact.push('<a href="mailto:' + esc(encodeURIComponent(MY_CONFIG.socials.email)) + '">' + esc(MY_CONFIG.socials.email) + '</a>');
      for (const href of [MY_CONFIG.siteUrl, MY_CONFIG.socials?.github, MY_CONFIG.socials?.linkedin]) if (safeLink(href)) contact.push(link(href.replace(/^https?:\/\//, ''), href));
      document.getElementById('resume-contact').innerHTML = contact.join(' &nbsp;|&nbsp; ');
      const entries = items => (items || []).map(item => '<div style="margin-bottom:12px"><div class="entry-head"><strong>' + link(item.title, item.link) + '</strong><span class="date">' + esc(item.date) + '</span></div><p>' + esc(item.learned) + '</p></div>').join('');
      document.getElementById('resume-content').innerHTML =
        section('Summary', '<p class="summary">' + esc(resume.summary || bio.desc) + '</p>') +
        section('Skills', (resume.skills || []).map(skill => '<div class="skills-row"><strong>' + esc(skill.label) + ':</strong> ' + esc(skill.value) + '</div>').join('')) +
        section('Experience', entries(data.experience)) + section('Projects', entries(data.projects)) +
        section('Education', (resume.education || []).map(item => '<div style="margin-bottom:10px"><div class="entry-head"><strong>' + esc(item.title) + '</strong><span class="date">' + esc(item.date) + '</span></div><p>' + esc(item.institution) + '</p><p>' + esc(item.description) + '</p></div>').join('')) +
        section('Certifications', entries(data.certs)) + section('Languages', esc(resume.languages));
    }
    loadResume().catch(error => document.getElementById('resume-content').textContent = error.message);
  </script>
</body></html>
